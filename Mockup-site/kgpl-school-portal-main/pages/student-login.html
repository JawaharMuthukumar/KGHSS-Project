<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Sign In — GHSS Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/shared.css">
<script>
tailwind.config = { theme: { extend: {
  colors:{ primary:'#0F4C81', secondary:'#2563EB', success:'#16A34A', warning:'#F59E0B', danger:'#DC2626' },
  fontFamily:{ sans:['Inter','sans-serif'] }
}}}
</script>
<script src="../js/app.js?v=11"></script>
</head>
<body class="text-white min-h-screen">
<div class="aurora-bg"><div class="aurora-grid"></div></div>

<div class="relative z-10 min-h-screen flex flex-col">
  <header class="top-toolbar flex items-center justify-between px-6 lg:px-10">
    <a href="student-select-class.html" class="flex items-center gap-2 text-sm text-white/70 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i>Change Class</a>
    <a href="home.html" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-secondary to-primary flex items-center justify-center font-bold text-xs">GS</div>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="glass-card w-full max-w-md p-9 fade-up">
      <div class="flex items-center gap-3 mb-6 p-3.5 rounded-xl2 bg-white/5 border border-white/10">
        <div class="portal-icon" style="width:40px;height:40px;background:linear-gradient(135deg,#F59E0B,#DC2626)"><i data-lucide="graduation-cap" class="w-4.5 h-4.5 text-white"></i></div>
        <div>
          <div class="text-[11px] text-white/50 uppercase tracking-wide font-semibold">Signing in as</div>
          <div id="class-label" class="font-bold text-lg leading-tight">Class —</div>
        </div>
      </div>

      <h1 class="text-2xl font-extrabold mb-1.5">Student Sign In</h1>
      <p class="text-white/55 text-sm mb-7">Use your Register Number and password to continue.</p>

      <form class="space-y-4" id="login-form">
        <div>
          <label class="text-xs font-semibold text-white/70 mb-1.5 block">Register Number</label>
          <input class="glass-input" id="regno" placeholder="e.g. GHSS/2026/0001" autocomplete="username">
        </div>
        <div>
          <label class="text-xs font-semibold text-white/70 mb-1.5 block">Password</label>
          <div class="relative">
            <input type="password" id="password" class="glass-input pr-11" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white" onclick="const i=document.getElementById('password'); i.type = i.type==='password'?'text':'password';"><i data-lucide="eye" class="w-4 h-4"></i></button>
          </div>
          <p class="text-[11px] text-white/40 mt-1.5 flex items-center gap-1.5"><i data-lucide="info" class="w-3 h-3"></i>Demo password: student</p>
        </div>
        <p id="error-msg" class="field-error hidden"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>Invalid Register Number or password.</p>
        <button type="submit" class="btn btn-secondary w-full justify-center mt-2">Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </form>

      <div class="text-center mt-6">
        <span class="text-xs text-white/40">Lost access or number changed? </span>
        <a href="#" class="text-xs font-semibold text-secondary hover:underline">Contact your Class Teacher</a>
      </div>
    </div>
  </main>
</div>
<script>
lucide.createIcons();
const params = new URLSearchParams(window.location.search);
const cls = params.get('class');
const labels = {
  '6A':'Class 6 · Section A','6B':'Class 6 · Section B','7A':'Class 7 · Section A','7B':'Class 7 · Section B',
  '8A':'Class 8 · Section A','8B':'Class 8 · Section B','9A':'Class 9 · Section A','9B':'Class 9 · Section B',
  '10A':'Class 10 · Section A','10B':'Class 10 · Section B',
  '11-G1':'Class 11 · Group I (Maths)','11-G2':'Class 11 · Group II (Biology)',
  '12-G1':'Class 12 · Group I (Maths)','12-G2':'Class 12 · Group II (Biology)'
};
if(cls && labels[cls]){ document.getElementById('class-label').textContent = labels[cls]; }
else { document.getElementById('class-label').textContent = 'Class 10 · Section B'; }

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const ok = studentLogin(document.getElementById('regno').value, document.getElementById('password').value);
  if (ok){ window.location.href = 'student-dashboard.html'; }
  else { document.getElementById('error-msg').classList.remove('hidden'); lucide.createIcons(); }
});
</script>
</body>
</html>
