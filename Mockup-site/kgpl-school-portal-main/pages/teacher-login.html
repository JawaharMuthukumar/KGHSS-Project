<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Sign In — GHSS Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/shared.css">
<script>
tailwind.config = { theme: { extend: {
  colors:{ primary:'#0F4C81', secondary:'#2563EB', success:'#16A34A', warning:'#F59E0B', danger:'#DC2626' },
  fontFamily:{ sans:['Inter','sans-serif'] }
}}}
</script>
<script src="../js/app.js?v=11"></script>
</head>
<body class="text-white min-h-screen">
<div class="aurora-bg"><div class="aurora-grid"></div></div>

<div class="relative z-10 min-h-screen flex flex-col">
  <header class="top-toolbar flex items-center justify-between px-6 lg:px-10">
    <a href="gateway.html" class="flex items-center gap-2 text-sm text-white/70 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i>All Portals</a>
    <a href="home.html" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-secondary to-primary flex items-center justify-center font-bold text-xs">GS</div>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="glass-card w-full max-w-md p-9 fade-up">
      <div class="portal-icon mb-5" style="background:linear-gradient(135deg,#16A34A,#0F4C81)"><i data-lucide="users" class="w-6 h-6 text-white"></i></div>
      <h1 class="text-2xl font-extrabold mb-1.5">Teacher Portal</h1>
      <p class="text-white/55 text-sm mb-8">Sign in with your Employee ID. Class Teachers also manage their assigned class from here.</p>

      <form class="space-y-4" id="login-form">
        <div>
          <label class="text-xs font-semibold text-white/70 mb-1.5 block">Employee ID</label>
          <input class="glass-input" id="empId" placeholder="e.g. GHSS/T/101" autocomplete="username">
        </div>
        <div>
          <label class="text-xs font-semibold text-white/70 mb-1.5 block">Password</label>
          <div class="relative">
            <input type="password" id="password" class="glass-input pr-11" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40 hover:text-white" onclick="const i=document.getElementById('password'); i.type = i.type==='password'?'text':'password';"><i data-lucide="eye" class="w-4 h-4"></i></button>
          </div>
          <p class="text-[11px] text-white/40 mt-1.5">First-time class teacher? Use the temporary password issued by the Headmaster, then set a new one.</p>
        </div>
        <p id="error-msg" class="field-error hidden"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>Invalid Employee ID or password.</p>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-white/60"><input type="checkbox" class="rounded"> Keep me signed in</label>
          <span class="text-white/40">Demo: GHSS/T/101 / teacher</span>
        </div>
        <button type="submit" class="btn btn-secondary w-full justify-center mt-2">Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </form>
    </div>
  </main>
</div>
<script>
lucide.createIcons();
document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const ok = teacherLogin(document.getElementById('empId').value, document.getElementById('password').value);
  if (ok){ window.location.href = 'teacher-dashboard.html'; }
  else { document.getElementById('error-msg').classList.remove('hidden'); lucide.createIcons(); }
});
</script>
</body>
</html>
